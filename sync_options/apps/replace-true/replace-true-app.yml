apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: replace-true
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
    path: sync_options/apps/replace-true
    directory:
      disableExtensionFilter: false
      recurse: false
      exclude: '{replace-true-app.yml}'
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}
    syncOptions:
    - Replace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: create-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
    path: sync_options/apps/create-namespace
    directory:
      disableExtensionFilter: false
      recurse: false
      exclude: '{create-namespace-app.yml}'
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: testcreatenamespace
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true

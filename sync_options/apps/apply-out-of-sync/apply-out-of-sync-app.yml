apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apply-out-of-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
    path: sync_options/apps/apply-out-of-sync
    directory:
      disableExtensionFilter: false
      recurse: false
      exclude: '{apply-out-of-sync-app.yml}'
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}
    syncOptions:
    - ApplyOutOfSyncOnly=true

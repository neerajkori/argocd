apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: client-side-apply
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
    path: sync_options/apps/client-side-apply
    directory:
      disableExtensionFilter: false
      recurse: false
      exclude: '{client-side-apply-app.yml}'
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}
    syncOptions:
    - ClientSideApplyMigration=true

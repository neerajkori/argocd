apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delete-false-demo
  namespace: argocd
spec:
  project: argo-dev
  source:
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
    path: sync_options
    directory:
      include: 'cm-keep.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: team1-kndev
  syncPolicy:
    syncOptions:
      - Delete=false

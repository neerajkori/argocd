apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
spec:
  destination:
    namespace: testsyncops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: sync_options
    directory:
      # include: 'some-directory/*'                                   
      disableExtensionFilter: false   
      exclude: '{apps/**,cm-*}'                               
      recurse: false                                                  
      include: '*.yaml'                                               
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true              #[This will create the namespace if it does not exist on the target cluster]


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
  metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true           # Enable server-side diff & mutation webhook for this application , Global option can be set in argocd-cm configmap
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: driffting
    directory:
      disableExtensionFilter: false                                   
      recurse: false                                                  
      exclude: '{auto-sync-app.yml}'                                  
      include: '*.yaml'                                               
    repoURL: https://github.com/neerajkori/argocd.git
    targetRevision: HEAD
  syncPolicy:
    automated: 
      enabled: true